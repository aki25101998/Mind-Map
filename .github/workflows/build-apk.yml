name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Quality Gate Checks
        env:
          VITE_FIREBASE_API_KEY: 'AIzaSyBa-VjXKmN9SsdBEUZTU6hiAojirVLfH5I'
          VITE_FIREBASE_AUTH_DOMAIN: 'mind-map-yoogi-2026.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'mind-map-yoogi-2026'
          VITE_FIREBASE_STORAGE_BUCKET: 'mind-map-yoogi-2026.firebasestorage.app'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '29280470857'
          VITE_FIREBASE_APP_ID: '1:29280470857:web:c59547d3b9d4f48fee3c98'
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Prepare Gradlew & Accept Android Licenses
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Copy Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx --yes @capacitor/cli copy android || true

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > ../gradle-build.log 2>&1 || true
          cd ..

      - name: Publish Built APK or Log to git branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Find APK
          APK_FILE=$(find android -type f -name "*.apk" | head -n 1)
          mkdir -p /tmp/artifacts
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" /tmp/artifacts/Freeform-MindMap.apk
          else
            echo "No APK found. Will upload build log."
          fi
          cp gradle-build.log /tmp/artifacts/build.log
          
          git checkout --orphan build-output
          git rm -rf .
          cp /tmp/artifacts/* .
          git add .
          git commit -m "build: update apk and build log"
          git push origin build-output --force

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freeform-MindMap-APK
          path: Freeform-MindMap.apk
          if-no-files-found: ignore
          retention-days: 30
