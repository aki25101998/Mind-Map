name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Quality Gate Checks
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Prepare Gradlew & Accept Android Licenses
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Copy Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx --yes @capacitor/cli copy android || true

      - name: Build Debug APK with Gradle
        id: gradle_build
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log
        continue-on-error: true

      - name: Handle Gradle Failure
        if: steps.gradle_build.outcome == 'failure'
        run: |
          echo "### ❌ Gradle Build Error Details" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log
          exit 1

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Freeform-MindMap-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freeform-MindMap-APK
          path: release-output/Freeform-MindMap-v1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete mobile-latest --yes || true
          git tag -d mobile-latest || true
          git push origin :refs/tags/mobile-latest || true
          gh release create mobile-latest release-output/Freeform-MindMap-v1.0.apk \
            --title "Freeform Mind Map Mobile APK" \
            --notes "File APK cài đặt trực tiếp trên điện thoại Android"
        continue-on-error: true
