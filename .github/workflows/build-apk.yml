name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Quality Gate Checks
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Freeform-MindMap-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freeform-MindMap-APK
          path: release-output/Freeform-MindMap-v1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-latest
          name: "Freeform Mind Map Mobile APK (Latest)"
          body: |
            ## 📱 Freeform Mind Map Android APK
            
            Tải file APK trực tiếp về điện thoại và cài đặt:
            - **Tên file:** `Freeform-MindMap-v1.0.apk`
            - **Hệ điều hành:** Android 7.0 trở lên
            - **Hướng dẫn cài đặt:**
              1. Tải file `Freeform-MindMap-v1.0.apk` về điện thoại.
              2. Nhấn vào file APK vừa tải và chọn **Cài đặt (Install)**.
              3. Nếu điện thoại hiện cảnh báo nguồn lạ, bật **Cho phép cài đặt từ nguồn này (Allow from this source)**.
          files: release-output/Freeform-MindMap-v1.0.apk
        continue-on-error: true
