<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đăng nhập Google - Freeform Mind Map</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 36px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }
    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(249, 115, 22, 0.35);
    }
    .logo svg {
      width: 34px;
      height: 34px;
      color: white;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      background: #f8fafc;
      color: #0f172a;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-return {
      background: #22c55e;
      color: #ffffff;
      margin-top: 16px;
      font-size: 16px;
    }
    .btn-return:hover {
      background: #16a34a;
    }
    .status-box {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
      display: none;
    }
    .status-success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
    }
    .status-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .status-info {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
    }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(15, 23, 42, 0.2);
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
    </div>
    <h1>Freeform Mind Map</h1>
    <p id="desc">Đang tiến hành xác thực tài khoản Google an toàn...</p>

    <button id="btn-login" class="btn">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.66 15.63 16.88 16.8 15.71 17.58V20.35H19.27C21.36 18.43 22.56 15.6 22.56 12.25Z" fill="#4285F4"/>
        <path d="M12 23C14.97 23 17.46 22.02 19.27 20.35L15.71 17.58C14.73 18.24 13.48 18.64 12 18.64C9.13 18.64 6.7 16.7 5.84 14.1H2.18V16.94C3.99 20.53 7.7 23 12 23Z" fill="#34A853"/>
        <path d="M5.84 14.1C5.62 13.44 5.5 12.74 5.5 12C5.5 11.26 5.62 10.56 5.84 9.9V7.06H2.18C1.43 8.55 1 10.22 1 12C1 13.78 1.43 15.45 2.18 16.94L5.84 14.1Z" fill="#FBBC05"/>
        <path d="M12 5.38C13.62 5.38 15.06 5.93 16.2 7.02L19.35 3.87C17.46 2.11 14.97 1 12 1C7.7 1 3.99 3.47 2.18 7.06L5.84 9.9C6.7 7.3 9.13 5.38 12 5.38Z" fill="#EA4335"/>
      </svg>
      <span>Bấm để đăng nhập Google</span>
    </button>

    <div id="status" class="status-box"></div>
    <a id="btn-return" class="btn btn-return" style="display: none;">🚀 Mở ứng dụng Freeform Mind Map</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBa-VjXKmN9SsdBEUZTU6hiAojirVLfH5I",
      authDomain: "mind-map-yoogi-2026.firebaseapp.com",
      projectId: "mind-map-yoogi-2026",
      storageBucket: "mind-map-yoogi-2026.firebasestorage.app",
      messagingSenderId: "29280470857",
      appId: "1:29280470857:web:c59547d3b9d4f48fee3c98"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    const btnLogin = document.getElementById('btn-login');
    const statusBox = document.getElementById('status');
    const btnReturn = document.getElementById('btn-return');
    const desc = document.getElementById('desc');

    function showStatus(text, type) {
      statusBox.style.display = 'block';
      statusBox.className = 'status-box status-' + type;
      statusBox.innerText = text;
    }

    function returnToApp(idToken, accessToken) {
      const intentUrl = `intent://oauth?idToken=${encodeURIComponent(idToken)}${accessToken ? `&accessToken=${encodeURIComponent(accessToken)}` : ''}#Intent;scheme=com.yoogi.mindmap;package=com.yoogi.mindmap;end;`;
      const fallbackScheme = `com.yoogi.mindmap://oauth?idToken=${encodeURIComponent(idToken)}${accessToken ? `&accessToken=${encodeURIComponent(accessToken)}` : ''}`;

      btnLogin.style.display = 'none';
      desc.innerText = "Xác thực Google thành công!";
      showStatus("Đã đăng nhập thành công! Bấm nút bên dưới để quay lại ứng dụng.", "success");
      
      btnReturn.style.display = 'inline-flex';
      btnReturn.href = intentUrl;
      btnReturn.onclick = () => {
        setTimeout(() => {
          window.location.href = fallbackScheme;
        }, 300);
      };

      // Try automatic redirect
      window.location.href = intentUrl;
      setTimeout(() => {
        window.location.href = fallbackScheme;
      }, 500);
    }

    // Step 1: Check if user just returned from Google redirect
    try {
      showStatus("Đang kiểm tra kết quả đăng nhập...", "info");
      const result = await getRedirectResult(auth);
      if (result && result.user) {
        const credential = GoogleAuthProvider.credentialFromResult(result);
        const idToken = credential?.idToken;
        const accessToken = credential?.accessToken;

        if (idToken) {
          returnToApp(idToken, accessToken);
        } else {
          showStatus("Không tìm thấy token Google. Vui lòng thử lại.", "error");
        }
      } else {
        // Not returned from redirect yet. Check if auto=true
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('auto') === 'true') {
          showStatus("Đang chuyển hướng sang Google...", "info");
          btnLogin.disabled = true;
          btnLogin.innerHTML = '<span class="spinner"></span> <span>Đang mở Google...</span>';
          await signInWithRedirect(auth, provider);
        } else {
          statusBox.style.display = 'none';
        }
      }
    } catch (err) {
      console.error("Auth redirect error:", err);
      showStatus(err.message || "Lỗi khi xử lý đăng nhập Google.", "error");
      btnLogin.disabled = false;
      btnLogin.innerHTML = '<span>Thử lại với Google</span>';
    }

    btnLogin.addEventListener('click', async () => {
      btnLogin.disabled = true;
      btnLogin.innerHTML = '<span class="spinner"></span> <span>Đang mở Google...</span>';
      showStatus("Đang chuyển hướng sang Google...", "info");
      try {
        await signInWithRedirect(auth, provider);
      } catch (err) {
        console.error(err);
        showStatus(err.message || "Lỗi khi chuyển hướng đăng nhập.", "error");
        btnLogin.disabled = false;
        btnLogin.innerHTML = '<span>Bấm để đăng nhập Google</span>';
      }
    });
  </script>
</body>
</html>
